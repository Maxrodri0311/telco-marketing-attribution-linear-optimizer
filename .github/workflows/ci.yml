name: CI, Quality Guards & Quantitative Benchmarks

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-verification:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies & package
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Validate No Hardcoded Credentials
      run: python scripts/validate_no_credentials.py

    - name: Validate No Internal Leaks
      run: python scripts/validate_no_internal_leaks.py

    - name: Validate SQL Complexity & Window Functions
      run: python scripts/validate_sql_complexity.py

    - name: Validate Byte Budget Distribution
      run: python scripts/validate_byte_budget.py

    - name: Validate Dockerfile Production-Ready
      run: python scripts/validate_dockerfile_production.py

    - name: Run Pytest Invariant Suite
      env:
        PYTHONPATH: .
      run: |
        python -m pytest tests/ -v

    - name: Run Latency Benchmarks
      env:
        PYTHONPATH: .
      run: |
        python tests/benchmark.py
